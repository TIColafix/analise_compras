
name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-analise-compras
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicacao
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/style.css

          mkdir -p _site
          cp -a dist/. _site/

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          site = Path("_site")
          base = "/analise_compras/"

          # Corrigir apenas referencias a arquivos
          # locais existentes na pasta publicada.
          for file in site.rglob("*.html"):
              html = file.read_text(encoding="utf-8")

              # Remover tags base antigas.
              html = re.sub(
                  r"<base\b[^>]*>",
                  "",
                  html,
                  flags=re.IGNORECASE
              )

              def fix_resource(match):
                  attr = match.group(1)
                  quote = match.group(2)
                  url = match.group(3)

                  # Preservar URLs externas e especiais.
                  if url.startswith((
                      "http:", "https:", "//",
                      "data:", "blob:", "#",
                      "mailto:", "tel:"
                  )):
                      return match.group(0)

                  # Separar caminho de query/hash.
                  parts = re.match(
                      r"([^?#]*)(.*)",
                      url
                  )

                  path = parts.group(1)
                  suffix = parts.group(2)

                  # Remover prefixos duplicados.
                  path = path.lstrip("/")

                  while path.startswith(
                      base.lstrip("/")
                  ):
                      path = path[
                          len(base.lstrip("/")):
                      ]

                  # Resolver arquivo local.
                  candidate = site / path

                  if candidate.is_file():
                      return (
                          f'{attr}={quote}'
                          f'./{path}{suffix}{quote}'
                      )

                  return match.group(0)

              html = re.sub(
                  r'\b(src|href)\s*=\s*(["\'])(.*?)\2',
                  fix_resource,
                  html,
                  flags=re.IGNORECASE
              )

              file.write_text(
                  html,
                  encoding="utf-8"
              )

          print("HTML preparado com sucesso.")
          PY

          # Desabilitar processamento Jekyll.
          touch _site/.nojekyll

          echo "Arquivos preparados:"
          ls -lah _site/

      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v3
        with:
          name: pages-analise-compras
          path: ./_site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-analise-compras

      - name: Exibir URL
        run: |
          echo "GitHub Pages publicado:"
          echo "https://ticolafix.github.io/analise_compras/"
