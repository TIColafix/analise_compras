
name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar aplicacao
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html

          mkdir -p _site
          cp -a dist/. _site/

          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path("_site")
          base = "/analise_compras/"

          for file in site.rglob("*.html"):
              html = file.read_text(encoding="utf-8")

              # Remover bases antigas ou duplicadas
              html = re.sub(
                  r'<base\b[^>]*>',
                  '',
                  html,
                  flags=re.IGNORECASE
              )

              # Corrigir apenas recursos locais
              # conhecidos que existem na pasta dist
              def fix_resource(match):
                  attr = match.group(1)
                  quote = match.group(2)
                  url = match.group(3)

                  path = url.split("?", 1)[0]
                  path = path.split("#", 1)[0]

                  while path.startswith(base):
                      path = path[len(base):]

                  path = path.lstrip("/")

                  if (site / path).is_file():
                      suffix = url[len(url.split("?", 1)[0]):] \
                          if "?" in url else ""
                      return (
                          f'{attr}={quote}./{path}'
                          f'{suffix}{quote}'
                      )

                  return match.group(0)

              html = re.sub(
                  r'\b(src|href)\s*=\s*(["\'])(.*?)\2',
                  fix_resource,
                  html,
                  flags=re.IGNORECASE
              )

              file.write_text(html, encoding="utf-8")

          print("HTML preparado para GitHub Pages")
          PY

          touch _site/.nojekyll

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
