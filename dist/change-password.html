<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar minha senha · Colafix</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17263b;font:15px Arial,sans-serif}header{background:#242b36;color:#fff;padding:20px 5%;display:flex;justify-content:space-between}header a{color:#fff}main{max-width:510px;margin:38px auto;padding:0 16px}section{background:#fff;border:1px solid #dbe3ed;border-radius:12px;padding:26px}h1{margin-top:0}p{line-height:1.5}label{display:block;font-weight:600;margin-top:18px}input{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #a9b7c8;border-radius:7px;font-size:16px}button{margin-top:22px;padding:12px 18px;border:0;border-radius:7px;background:#086dd4;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.message{padding:12px;border-radius:7px;background:#ffe5e5;color:#9d1c25}.success{background:#e6f5e9;color:#174f2b}html[data-theme=dark] body{background:#101720;color:#edf3ff}html[data-theme=dark] section{background:#1c293a;border-color:#3b506b}html[data-theme=dark] input{background:#142236;color:white;border-color:#526781}html[data-theme=dark] .message{background:#4a252b;color:#ffdde1}html[data-theme=dark] .success{background:#20422f;color:#d7ffe6}
</style></head><body><header><strong>Colafix · Minha conta</strong><a href="/">← Voltar ao sistema</a></header><main><section><h1>Alterar minha senha</h1><p>Informe sua senha atual e escolha uma nova senha. Após salvar, entre novamente em todos os dispositivos.</p><form id="password-form"><label>Senha atual<input type="password" name="currentPassword" autocomplete="current-password" required maxlength="256"></label><label>Nova senha<input type="password" name="newPassword" autocomplete="new-password" required minlength="8" maxlength="256"></label><label>Confirmar nova senha<input type="password" name="confirmPassword" autocomplete="new-password" required minlength="8" maxlength="256"></label><button type="submit">Alterar senha</button></form><p id="message" role="status" hidden></p><a id="login" href="/login" hidden>Entrar novamente</a></section></main><script src="/change-password.js" defer></script></body></html>
