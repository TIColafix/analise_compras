<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Migração segura</title><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 20px}label{display:block;margin:16px 0 6px}button{margin-top:20px;padding:10px 18px}pre{white-space:pre-wrap;background:#f4f4f4;padding:12px}</style><h1>Migração segura de dados</h1><p>Selecione somente os arquivos locais abaixo. O envio grava documentos ausentes no PostgreSQL e nunca sobrescreve um documento que já exista.</p><label>Base principal — dist/data.json</label><input id="main" type="file" accept=".json"><label>Cimento — source-data/cement-loads.json</label><input id="cement" type="file" accept=".json"><label>Diesel — source-data/diesel-loads.json</label><input id="diesel" type="file" accept=".json"><label>Prazos — source-data/delivery-deadlines.json</label><input id="deadlines" type="file" accept=".json"><label>Manutenção/MP — source-data/maintenance-orders.json</label><input id="maintenance" type="file" accept=".json"><br><button id="send">Migrar sem sobrescrever</button><pre id="out"></pre><script>const ids=['main','cement','diesel','deadlines','maintenance'];document.querySelector('#send').onclick=async()=>{const out=document.querySelector('#out');try{const documents={};for(const id of ids){const f=document.querySelector('#'+id).files[0];if(f)documents[id]=JSON.parse(await f.text())}if(!Object.keys(documents).length)throw Error('Selecione ao menos um arquivo.');out.textContent='Enviando...';const r=await fetch('/api/admin/migrate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({documents})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha na migração.');out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent='ERRO: '+e.message}}</script></html>
